; PHP settings of the image of the functions, over those of Bref (/opt/bref/etc/php/conf.d/bref.ini).

; Shipped by Bref and disabled by default: the application requires them (composer.json), as the local
; image installs them.
extension=intl
extension=redis

; Answers do not name the PHP version (X-Powered-By), as in the local image.
expose_php = Off
