# The triggers of the consumers, of the scheduled functions and of the notifier, written as CloudFormation: the
# queues and the topic come from parameters of the template (osls names a mapping or a subscription after the ARN
# it is given, which a parameter is not), and the schedules retry nothing (osls sets no retry policy on a
# schedule). The trigger of the API is its httpApi event in serverless.yml.
Resources:
  # Batches of up to 10 messages, as soon as there are any (no batching window: each step of the chain
  # waits for the previous one), with a partial batch response, so a message that fails never sends the
  # others back. At most as many invocations at once as the reserved concurrency of the function.
  ChainQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ChainLambdaFunction
      EventSourceArn: !Ref ChainQueueArn
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 10
      Enabled: true
  WebhooksQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref WebhooksLambdaFunction
      EventSourceArn: !Ref WebhooksQueueArn
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 5
      Enabled: true

  # Once a minute, invoked asynchronously with the role of the stack compute. The event is the command
  # line of php artisan (App\Support\Lambda\ArtisanHandler). A run that fails is not retried, by the schedule
  # or by the invocation (maximumRetryAttempts of the function): the next minute is its retry.
  RelaySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: dian-einvoice-${sls:stage}-relay
      Description: The safety net of the outbox of dian-einvoice
      ScheduleExpression: rate(1 minute)
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt RelayLambdaFunction.Arn
        RoleArn: !Ref SchedulesRoleArn
        Input: '"outbox:publish-pending"'
        RetryPolicy:
          MaximumRetryAttempts: 0
          MaximumEventAgeInSeconds: 60
  SchedulerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: dian-einvoice-${sls:stage}-scheduler
      Description: The Laravel scheduler of dian-einvoice
      ScheduleExpression: rate(1 minute)
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt SchedulerLambdaFunction.Arn
        RoleArn: !Ref SchedulesRoleArn
        Input: '"schedule:run"'
        RetryPolicy:
          MaximumRetryAttempts: 0
          MaximumEventAgeInSeconds: 60

  # The notifier takes every notification of the topic of the alarms (stack alerts). What SNS cannot hand it, after
  # its own retries, goes to the dead-letter queue of the notifier; only that topic may invoke it.
  NotifierAlarmsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmsTopicArn
      Protocol: lambda
      Endpoint: !GetAtt NotifierLambdaFunction.Arn
      RedrivePolicy:
        deadLetterTargetArn: !Ref NotifierDeadLetterQueueArn
  NotifierAlarmsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt NotifierLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlarmsTopicArn
