# What the prod stage adds to serverless.yml: the functions run in the private subnets of the stack network
# of the CDK app, with its security group, and reach the managed database of the stack database, which
# publish these SSM parameters (NETWORK_PARAMETERS and DATABASE_PARAMETERS in infra/cdk/lib/stage.ts). The
# secrets of the two identities of the database are read in both stages (resources/parameters.yml).
# The role CloudFormation deploys the stack of the functions with (stack delivery of the CDK app), so whoever runs osls
# deploy needs no permission on Lambda, API Gateway, the logs or the schedules, only on this stack and its bucket.
deploymentRole: arn:aws:iam::${param:account}:role/dian-einvoice-prod-functions-deployment

vpc:
  securityGroupIds:
    - !Ref FunctionsSecurityGroupId
  subnetIds: !Split [',', !Ref PrivateSubnetIds]

resources:
  Parameters:
    PrivateSubnetIds:
      Type: AWS::SSM::Parameter::Value<String>
      Default: /dian-einvoice/prod/network/private-subnet-ids
      Description: The private subnets of the functions, separated by commas (stack network)
    FunctionsSecurityGroupId:
      Type: AWS::SSM::Parameter::Value<String>
      Default: /dian-einvoice/prod/network/functions-security-group-id
      Description: Security group of the functions, which the database admits (stack network)
    DatabaseHost:
      Type: AWS::SSM::Parameter::Value<String>
      Default: /dian-einvoice/prod/database/host
      Description: Address of the managed database, or of RDS Proxy in front of it (stack database)
    DatabasePort:
      Type: AWS::SSM::Parameter::Value<String>
      Default: /dian-einvoice/prod/database/port
      Description: Port of the managed database (stack database)
    DatabaseName:
      Type: AWS::SSM::Parameter::Value<String>
      Default: /dian-einvoice/prod/database/name
      Description: Database of the application in the managed database (stack database)
