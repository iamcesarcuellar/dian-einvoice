name: dian-einvoice

# Local development stack. Ports are published on 127.0.0.1 only, in the 8600-8699 range.
# api, worker, relay and web run with the host user (HOST_UID/HOST_GID, exported by the Makefile) so
# files in the repo stay yours. The secrets of the stack (REDIS_PASSWORD, DIAN_SIMULATOR_TOKEN) come
# from backend/.env, which make passes as --env-file and fills with random values (scripts/env.sh);
# redis and the simulator refuse to start without them. Every service has a healthcheck, which
# Infrastructure reuses: the API and the simulator answer /health, the workers and the relay check a
# heartbeat they write while they loop, plus the database and Redis (php artisan health:check).

# The backend image and its settings, shared by api, worker and relay (and by their counterparts of the
# emulated cloud): one Dockerfile, one image.
x-backend: &backend
  build:
    context: ./backend
    # The development target adds the tools of the local checks (xmlsec1, poppler-utils) to production.
    target: development
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  restart: "no"
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    mail:
      condition: service_healthy

# The processes of the application in the emulated cloud (profile cloud, make cloud-up): the same image and
# code with the AWS adapters, configured by backend/.env.cloud, which make cloud-up writes from the outputs of
# the CDK stage local. They need the database and the emulator, not Redis or the local mailbox.
x-cloud-backend: &cloud-backend
  <<: *backend
  # The image of api, built once for both environments.
  image: dian-einvoice-api:latest
  profiles: ["cloud"]
  env_file:
    - path: ./backend/.env.cloud
      required: false
  depends_on:
    db:
      condition: service_healthy
    floci:
      condition: service_healthy

services:
  api:
    <<: *backend
    mem_limit: 512m
    ports:
      - "127.0.0.1:8600:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Queue workers: they run every step of the electronic document chain.
  worker:
    <<: *backend
    mem_limit: 256m
    init: true
    deploy:
      replicas: 2
    command: ["sh", "docker/supervise.sh", "php", "artisan", "queue:work", "redis", "--sleep=0.5", "--timeout=35", "--tries=10", "--memory=192"]
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Outbox relay: publishes committed outbox events to the queue, in order.
  relay:
    <<: *backend
    mem_limit: 192m
    init: true
    command: ["sh", "docker/supervise.sh", "php", "artisan", "outbox:relay"]
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check", "relay"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional (profile tools), only through make analyse: PHPStan over the mounted backend, in the image of api
  # and with more memory than the api container (the type shapes of the AWS SDK take 1.4 GB to analyse).
  api-analyse:
    <<: *backend
    image: dian-einvoice-api:latest
    profiles: ["tools"]
    mem_limit: 2g

  web:
    build:
      context: ./frontend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    # The dev server pre-bundles the chart library (Unovis and its d3, map and graph modules) on
    # first use, which needs more than 1 GB.
    mem_limit: 2g
    init: true
    environment:
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:8601:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      - api

  # Optional (profile e2e): the end-to-end test of the web app in a browser, against the running stack
  # and its synthetic demo data. Playwright publishes no Alpine image: this one is Ubuntu (noble), with
  # the browsers of the exact @playwright/test version of e2e/package.json.
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: ["e2e"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 2g
    shm_size: 1gb
    init: true
    working_dir: /e2e
    environment:
      HOME: /tmp
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # The browser opens the app at http://localhost:8601, the origin the API accepts for session
      # sign-in; e2e/forward.mjs passes that port on to the web service.
      WEB_URL: http://web:5173
    volumes:
      - ./e2e:/e2e
    depends_on:
      - web

  # The DIAN of this project: a local simulator of its SOAP web service. Nothing reaches the DIAN.
  simulator:
    build:
      context: ./simulator
      # The official DIAN XSDs are kept once, in the backend; the image copies them from there.
      additional_contexts:
        dian-xsd: ./backend/resources/dian/xsd
    restart: "no"
    mem_limit: 384m
    init: true
    environment:
      # From backend/.env (DIAN_SIMULATOR_TOKEN): the backend sends the same one.
      SIMULATOR_ADMIN_TOKEN: ${DIAN_SIMULATOR_TOKEN:-}
    volumes:
      - simulator-data:/data
    ports:
      - "127.0.0.1:8602:8602"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8602/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional (profile tools): lint, type check and tests of the simulator over its mounted sources. The
  # dev dependencies live in the development image, so nothing is installed into the repo; the XSDs
  # are the single copy of the backend, read-only.
  simulator-dev:
    build:
      context: ./simulator
      target: development
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 512m
    environment:
      SIMULATOR_XSD_DIR: /workspace/xsd
    volumes:
      - ./simulator:/workspace/simulator
      - ./backend/resources/dian/xsd:/workspace/xsd:ro

  # Local development mailbox (Mailpit): it keeps every email the app sends over SMTP and relays
  # none, so nothing leaves this machine. Web interface and API on 127.0.0.1:8603; SMTP (1025) only
  # on the internal network.
  mail:
    image: axllent/mailpit:v1.33.0
    restart: "no"
    mem_limit: 128m
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 2000
      TZ: America/Bogota
    volumes:
      - mail-data:/data
    ports:
      - "127.0.0.1:8603:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional (profile tools), only through make dian-schematron: the schematron of the DIAN toolbox over
  # the demo documents. SaxonJS and SchXslt are downloaded once into the schematron-tools volume; nothing
  # goes into the repo or an image. Read-only: the toolbox, the stored documents and the scripts.
  schematron:
    image: node:26-alpine
    profiles: ["tools"]
    restart: "no"
    mem_limit: 1g
    user: node
    working_dir: /home/node
    environment:
      # The findings that do not fail the check, defined in the Makefile.
      - DIAN_SCHEMATRON_OUTDATED
    volumes:
      - schematron-tools:/home/node
      - ./scripts/dian-schematron:/check:ro
      - type: bind
        source: "./backend/storage/app/dian-toolbox/Caja de herramientas FE - V1.9 - (v2026-2)"
        target: /toolbox
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./backend/storage/app/documents
        target: /documents
        read_only: true
        bind:
          create_host_path: false
    command: ["sh", "/check/run.sh"]

  # Optional (profile security), only through make security: the secret scan of the git history and of
  # the changes not committed yet, read-only, with the rules of .gitleaks.toml.
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.28.0
    profiles: ["security"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 512m
    working_dir: /repo
    volumes:
      - .:/repo:ro

  # The emulated cloud (profile cloud, make cloud-up). Floci, an open-source local emulator of AWS (MIT, no
  # account), serves SNS, SQS, S3, SES, DynamoDB, KMS, Secrets Manager, SSM, CloudFormation, IAM and STS to the
  # CDK CLI and the application; its API is on 127.0.0.1:8604 and its state in a volume of its own. No Docker
  # socket: nothing of this stage runs containers, so it warns at start that the container services are off.
  floci:
    image: floci/floci:2.5.0
    profiles: ["cloud"]
    restart: "no"
    mem_limit: 512m
    environment:
      # The URLs it answers (queue URLs) name this service, which the other containers reach.
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
    volumes:
      - floci-data:/app/data
    ports:
      - "127.0.0.1:8604:4566"
    networks:
      default:
        aliases:
          # The asset bucket of cdk bootstrap, which the CDK CLI reaches by host name.
          - cdk-hnb659fds-assets-000000000000-us-east-1.floci
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The CDK app (infra/cdk), without a network: lint, type check, its tests and cdk synth of both stages
  # (make cdk-check, make lint, make analyse). The event routes of the backend, read-only. ESLint with the
  # types of aws-cdk-lib needs more than the default heap of Node.
  cdk:
    build:
      context: ./infra/cdk
    image: dian-einvoice-cdk:latest
    profiles: ["cloud"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 2g
    network_mode: none
    environment:
      HOME: /tmp
      NODE_OPTIONS: --max-old-space-size=1536
      EVENT_ROUTES: /workspace/outbox/routes.json
    volumes:
      - ./infra/cdk:/workspace/cdk
      - ./backend/resources/outbox:/workspace/outbox:ro

  # The same, on the network of the stack: cdk bootstrap and cdk deploy of the stage local to the emulator
  # (make cloud-up), which takes any credentials.
  cdk-deploy:
    image: dian-einvoice-cdk:latest
    pull_policy: never
    profiles: ["cloud"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 1g
    environment:
      HOME: /tmp
      EVENT_ROUTES: /workspace/outbox/routes.json
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: emulated
    volumes:
      - ./infra/cdk:/workspace/cdk
      - ./backend/resources/outbox:/workspace/outbox:ro
    depends_on:
      floci:
        condition: service_healthy

  # The API in the emulated cloud, in place of api: the same port, and the name api on the network, so the
  # web app reaches it unchanged.
  cloud-api:
    <<: *cloud-backend
    mem_limit: 512m
    ports:
      - "127.0.0.1:8600:8000"
    networks:
      default:
        aliases:
          - api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # The outbox relay of the emulated cloud: publishes committed events to the topic of document events.
  cloud-relay:
    <<: *cloud-backend
    mem_limit: 192m
    init: true
    command: ["sh", "docker/supervise.sh", "php", "artisan", "outbox:relay"]
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check", "relay"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Consumers of the SQS queue of the chain (electronic document chain, delivery, and the jobs the
  # application dispatches itself). A receive waits up to 10 s for a message, so stopping takes as long.
  cloud-chain:
    <<: *cloud-backend
    mem_limit: 256m
    init: true
    stop_grace_period: 20s
    deploy:
      replicas: 2
    command: ["sh", "docker/supervise.sh", "php", "artisan", "queue:work", "sqs", "--queue=chain", "--sleep=0.5", "--timeout=35", "--tries=10", "--memory=192"]
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Consumer of the SQS queue of the webhooks.
  cloud-webhooks:
    <<: *cloud-backend
    mem_limit: 256m
    init: true
    stop_grace_period: 20s
    command: ["sh", "docker/supervise.sh", "php", "artisan", "queue:work", "sqs", "--queue=webhooks", "--sleep=0.5", "--timeout=35", "--tries=10", "--memory=192"]
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: mysql:8.4
    restart: "no"
    mem_limit: 1g
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: dian_einvoice
      MYSQL_USER: dian
      MYSQL_PASSWORD: dian
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Queue, cache and sessions. Append-only file, so queued jobs survive a restart. No published port, and
  # a password (REDIS_PASSWORD of backend/.env): it does not start without one.
  redis:
    image: redis:7-alpine
    restart: "no"
    mem_limit: 128m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        test -n "$$REDIS_PASSWORD" || { echo 'REDIS_PASSWORD is empty: run make up, which writes one to backend/.env.' >&2; exit 1; };
        exec redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  redis-data:
  simulator-data:
  mail-data:
  schematron-tools:
  # State of the local AWS emulator (profile cloud); make cloud-clean removes it.
  floci-data:
