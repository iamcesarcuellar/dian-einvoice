name: dian-einvoice

# Local development stack. Ports are published on 127.0.0.1 only, in the 8600-8699 range.
# api, worker, relay and web run with the host user (HOST_UID/HOST_GID, exported by the Makefile) so
# files in the repo stay yours. The secrets of the stack (REDIS_PASSWORD, DIAN_SIMULATOR_TOKEN) come
# from backend/.env, which make passes as --env-file and fills with random values (scripts/env.sh);
# redis and the simulator refuse to start without them. Every service has a healthcheck, which
# Infrastructure reuses: the API and the simulator answer /health, the workers and the relay check a
# heartbeat they write while they loop, plus the database and Redis (php artisan health:check).

# The backend image and its settings, shared by api, worker and relay: one Dockerfile, one image.
x-backend: &backend
  build:
    context: ./backend
    # The development target adds the tools of the local checks (xmlsec1, poppler-utils) to production.
    target: development
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  restart: "no"
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    mail:
      condition: service_healthy

services:
  api:
    <<: *backend
    mem_limit: 512m
    ports:
      - "127.0.0.1:8600:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Queue workers: they run every step of the electronic document chain.
  worker:
    <<: *backend
    mem_limit: 256m
    init: true
    deploy:
      replicas: 2
    command: ["sh", "docker/supervise.sh", "php", "artisan", "queue:work", "redis", "--sleep=0.5", "--timeout=35", "--tries=10", "--memory=192"]
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Outbox relay: publishes committed outbox events to the queue, in order.
  relay:
    <<: *backend
    mem_limit: 192m
    init: true
    command: ["sh", "docker/supervise.sh", "php", "artisan", "outbox:relay"]
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check", "relay"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional (profile tools), only through make analyse: PHPStan over the mounted backend, in the image of api
  # and with more memory than the api container (the type shapes of the AWS SDK take 1.4 GB to analyse).
  api-analyse:
    <<: *backend
    image: dian-einvoice-api:latest
    profiles: ["tools"]
    mem_limit: 2g

  web:
    build:
      context: ./frontend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    # The dev server pre-bundles the chart library (Unovis and its d3, map and graph modules) on
    # first use, which needs more than 1 GB.
    mem_limit: 2g
    init: true
    environment:
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:8601:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      - api

  # Optional (profile e2e): the end-to-end test of the web app in a browser, against the running stack
  # and its synthetic demo data. Playwright publishes no Alpine image: this one is Ubuntu (noble), with
  # the browsers of the exact @playwright/test version of e2e/package.json.
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: ["e2e"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 2g
    shm_size: 1gb
    init: true
    working_dir: /e2e
    environment:
      HOME: /tmp
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # The browser opens the app at http://localhost:8601, the origin the API accepts for session
      # sign-in; e2e/forward.mjs passes that port on to the web service.
      WEB_URL: http://web:5173
    volumes:
      - ./e2e:/e2e
      # The web app's messages, read-only: the tests and the screenshots name what they click in the language of the
      # interface they run in (e2e/tests/messages.ts).
      - ./frontend/src/i18n:/messages:ro
    depends_on:
      - web

  # The DIAN of this project: a local simulator of its SOAP web service. Nothing reaches the DIAN.
  simulator:
    build:
      context: ./simulator
      # The official DIAN XSDs are kept once, in the backend; the image copies them from there.
      additional_contexts:
        dian-xsd: ./backend/resources/dian/xsd
    restart: "no"
    mem_limit: 384m
    init: true
    environment:
      # From backend/.env (DIAN_SIMULATOR_TOKEN): the backend sends the same one.
      SIMULATOR_ADMIN_TOKEN: ${DIAN_SIMULATOR_TOKEN:-}
    volumes:
      - simulator-data:/data
    ports:
      - "127.0.0.1:8602:8602"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8602/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional (profile tools): lint, type check and tests of the simulator over its mounted sources. The
  # dev dependencies live in the development image, so nothing is installed into the repo; the XSDs
  # are the single copy of the backend, read-only.
  simulator-dev:
    build:
      context: ./simulator
      target: development
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 512m
    environment:
      SIMULATOR_XSD_DIR: /workspace/xsd
    volumes:
      - ./simulator:/workspace/simulator
      - ./backend/resources/dian/xsd:/workspace/xsd:ro

  # Local development mailbox (Mailpit): it keeps every email the app sends over SMTP and relays
  # none, so nothing leaves this machine. Web interface and API on 127.0.0.1:8603; SMTP (1025) only
  # on the internal network.
  mail:
    image: axllent/mailpit:v1.33.0
    restart: "no"
    mem_limit: 128m
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 2000
      TZ: America/Bogota
    volumes:
      - mail-data:/data
    ports:
      - "127.0.0.1:8603:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional (profile tools), only through make dian-toolbox and make dian-schematron: the DIAN toolbox v1.9,
  # downloaded once from the DIAN into backend/storage/app/dian-toolbox (git ignores it), checked against its
  # SHA-256 and extracted, and the schemas of the repository compared with its own (scripts/dian-toolbox.sh).
  dian-toolbox:
    image: node:26-alpine
    profiles: ["tools"]
    restart: "no"
    mem_limit: 256m
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./backend/storage/app:/storage
      - ./backend/resources/dian/xsd:/xsd:ro
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/dian-toolbox.sh"]

  # Optional (profile tools), only through make dian-schematron: the schematron of the DIAN toolbox over
  # the demo documents. SaxonJS and SchXslt are downloaded once into the schematron-tools volume; nothing
  # goes into the repo or an image. Read-only: the toolbox, the stored documents and the scripts.
  schematron:
    image: node:26-alpine
    profiles: ["tools"]
    restart: "no"
    mem_limit: 1g
    user: node
    working_dir: /home/node
    environment:
      # The findings that do not fail the check, defined in the Makefile.
      - DIAN_SCHEMATRON_OUTDATED
    volumes:
      - schematron-tools:/home/node
      - ./scripts/dian-schematron:/check:ro
      - type: bind
        source: "./backend/storage/app/dian-toolbox/Caja de herramientas FE - V1.9 - (v2026-2)"
        target: /toolbox
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./backend/storage/app/documents
        target: /documents
        read_only: true
        bind:
          create_host_path: false
    command: ["sh", "/check/run.sh"]

  # Optional (profile security), only through make security: the secret scan of the git history and of
  # the changes not committed yet, read-only, with the rules of .gitleaks.toml.
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.28.0
    profiles: ["security"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 512m
    working_dir: /repo
    volumes:
      - .:/repo:ro

  # The emulated cloud (profile cloud, make cloud-up). Floci, an open-source local emulator of AWS (MIT, no
  # account), serves SNS, SQS, S3, SES, DynamoDB, KMS, Secrets Manager, SSM, CloudFormation, IAM, STS, ECR,
  # Lambda, API Gateway, EventBridge Scheduler and CloudWatch Logs to the CDK CLI, osls and the application;
  # its API is on 127.0.0.1:8604 and its state in a volume of its own.
  #
  # It runs each Lambda function in a container of its own, through the Docker socket, which only this
  # profile mounts. Its entrypoint starts as root only to read the group of the socket, then runs as its
  # unprivileged user (UID 1001) with that group. What it creates carries the name of the project and the
  # label dian-einvoice=floci, by which make cloud-down removes it: the containers of the functions
  # (dian-einvoice-dian-einvoice-<function>-<id>, on the network of this project, run as an unprivileged
  # user, as Lambda does, at most 8 kept warm in all), the registry behind its ECR
  # (floci-aws-dian-einvoice-ecr, 127.0.0.1:8610, volume floci-aws-dian-einvoice-ecr-registry-data) and its
  # web console (floci-aws-dian-einvoice-console, started by http://localhost:8604/_floci/ui, on
  # 127.0.0.1:8605). It never removes anything else.
  floci:
    image: floci/floci:2.5.0
    profiles: ["cloud"]
    restart: "no"
    mem_limit: 768m
    environment:
      # The URLs it answers (queue URLs) name this service, which the other containers reach.
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      # A resource type it cannot create fails its stack instead of being stubbed.
      FLOCI_SERVICES_CLOUDFORMATION_ALLOW_STUB_UNSUPPORTED_RESOURCE_TYPES: "false"
      FLOCI_DOCKER_RESOURCE_NAMESPACE: dian-einvoice
      FLOCI_DOCKER_EXTRA_LABELS_0__KEY: dian-einvoice
      FLOCI_DOCKER_EXTRA_LABELS_0__VALUE: floci
      FLOCI_SERVICES_LAMBDA_CONTAINER_NAME_PREFIX: dian-einvoice
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: dian-einvoice_default
      # The functions run as an unprivileged user that owns nothing in the image, as Lambda runs them, so
      # the application can write to /tmp only.
      FLOCI_SERVICES_LAMBDA_DOCKER_FLAGS: --user 993:990
      # WSL shares its memory with other projects: at most 8 idle containers of functions in all, 2 per
      # function, removed after 5 minutes without an invocation.
      FLOCI_SERVICES_LAMBDA_WARM_POOL_MAX_TOTAL: "8"
      FLOCI_SERVICES_LAMBDA_WARM_POOL_MAX_PER_FUNCTION: "2"
      FLOCI_SERVICES_LAMBDA_CONTAINER_IDLE_TIMEOUT_SECONDS: "300"
      # A cold start caches the configuration and reads the secrets before its first invocation; a busy CI
      # runner may take longer than the 10 s of Lambda.
      FLOCI_SERVICES_LAMBDA_INIT_TIMEOUT_SECONDS: "30"
      FLOCI_SERVICES_LAMBDA_POLL_INTERVAL_MS: "1000"
      FLOCI_SERVICES_ECR_REGISTRY_IMAGE: registry:2.8.3
      FLOCI_SERVICES_ECR_REGISTRY_CONTAINER_NAME: dian-einvoice-ecr
      FLOCI_SERVICES_ECR_REGISTRY_BASE_PORT: "8610"
      FLOCI_SERVICES_ECR_REGISTRY_MAX_PORT: "8619"
      FLOCI_SERVICES_ECR_KEEP_RUNNING_ON_SHUTDOWN: "false"
      FLOCI_SERVICES_UI_IMAGE: floci/floci-ui:0.7.0
      FLOCI_SERVICES_UI_CONTAINER_NAME: dian-einvoice-console
      FLOCI_SERVICES_UI_PORT: "8605"
      FLOCI_SERVICES_UI_BIND_ADDRESS: 127.0.0.1
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8604:4566"
    networks:
      default:
        aliases:
          # Buckets the CLIs reach by host name: the assets of cdk bootstrap and the deployments of osls.
          - cdk-hnb659fds-assets-000000000000-us-east-1.floci
          - dian-einvoice-local-deployments-000000000000-us-east-1.floci
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The CDK app (infra/cdk), without a network: lint, type check, its tests and cdk synth of both stages
  # (make cdk-check, make lint, make analyse). Read-only: the event routes of the backend, the AWS services
  # its adapters call, the security headers and the paths of the edge, the templates osls packaged for the
  # functions, the documentation, whose table of those services a test checks, and the index.html of the web
  # app, whose inline script the Content-Security-Policy of the edge allows by its hash. ESLint with the types
  # of aws-cdk-lib needs more than the default heap of Node.
  cdk:
    build:
      context: ./infra/cdk
    image: dian-einvoice-cdk:latest
    profiles: ["cloud"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 2g
    network_mode: none
    environment:
      HOME: /tmp
      NODE_OPTIONS: --max-old-space-size=1536
      EVENT_ROUTES: /workspace/outbox/routes.json
      AWS_SERVICES: /workspace/aws/services.json
      HTTP_RESOURCES: /workspace/http
      LOG_SCHEMA: /workspace/observability/log-schema.json
      FUNCTIONS_TEMPLATES: /workspace/functions
      DOCS: /workspace/docs
      WEB_APP_INDEX: /workspace/frontend/index.html
    volumes:
      - ./infra/cdk:/workspace/cdk
      - ./backend/resources/outbox:/workspace/outbox:ro
      - ./backend/resources/aws:/workspace/aws:ro
      - ./backend/resources/http:/workspace/http:ro
      - ./backend/resources/observability:/workspace/observability:ro
      - ./infra/functions:/workspace/functions:ro
      - ./docs:/workspace/docs:ro
      - ./frontend/index.html:/workspace/frontend/index.html:ro

  # The same, on the network of the stack: cdk bootstrap and cdk deploy of the stage local to the emulator
  # (make cloud-up), which takes any credentials.
  cdk-deploy:
    image: dian-einvoice-cdk:latest
    pull_policy: never
    profiles: ["cloud"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 1g
    environment:
      HOME: /tmp
      EVENT_ROUTES: /workspace/outbox/routes.json
      AWS_SERVICES: /workspace/aws/services.json
      HTTP_RESOURCES: /workspace/http
      LOG_SCHEMA: /workspace/observability/log-schema.json
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: emulated
    volumes:
      - ./infra/cdk:/workspace/cdk
      - ./backend/resources/outbox:/workspace/outbox:ro
      - ./backend/resources/aws:/workspace/aws:ro
      - ./backend/resources/http:/workspace/http:ro
      - ./backend/resources/observability:/workspace/observability:ro
    depends_on:
      floci:
        condition: service_healthy

  # The image of every function (target lambda of backend/Dockerfile): only built, never started here; make
  # cloud-up pushes it to the ECR of the emulator, which runs it.
  lambda:
    build:
      context: ./backend
      target: lambda
    image: dian-einvoice-lambda:latest
    profiles: ["cloud"]
    restart: "no"
    mem_limit: 256m
    deploy:
      replicas: 0

  # The serverless service of the functions (infra/functions, osls), without a network: osls package of
  # both stages for make cdk-check, which needs no credentials, and its tests, which read the runbooks and the deployment
  # guide (docs), the targets of the Makefile and the scripts of the repository they cite, read-only.
  functions:
    build:
      context: ./infra/functions
    image: dian-einvoice-functions:latest
    profiles: ["cloud"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 1g
    network_mode: none
    environment:
      HOME: /tmp
    volumes:
      - ./infra/functions:/workspace/functions
      - ./backend/resources/observability:/workspace/observability:ro
      - ./docs:/workspace/docs:ro
      - ./Makefile:/workspace/Makefile:ro
      - ./scripts:/workspace/scripts:ro

  # The same, on the network of the stack: osls deploy of the stage local to the emulator, and the scripts
  # that invoke the console function and read the functions, upload the web app to the edge and check it (make
  # cloud-up, make cloud-check). The admin token of the DIAN simulator (backend/.env) is given to the functions
  # of the stage local. Read-only: the web app (its build, frontend/dist), the paths and security headers of the
  # edge, and the cases of the routes of the web app.
  functions-deploy:
    image: dian-einvoice-functions:latest
    pull_policy: never
    profiles: ["cloud"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 1g
    environment:
      HOME: /tmp
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: emulated
      SIMULATOR_TOKEN: ${DIAN_SIMULATOR_TOKEN:-}
    volumes:
      - ./infra/functions:/workspace/functions
      - ./frontend:/workspace/web:ro
      - ./backend/resources/http:/workspace/http:ro
      - ./backend/resources/observability:/workspace/observability:ro
      - ./infra/cdk/edge:/workspace/edge:ro
    depends_on:
      floci:
        condition: service_healthy

  # The deployment of a real account (scripts/deploy.sh prod, run by .github/workflows/deploy.yml, which has never run):
  # the CDK app and the serverless service with the credentials of the role the workflow assumed, from the environment,
  # and no endpoint of the emulator. Profile release only; nothing of it starts with make.
  cdk-release:
    image: dian-einvoice-cdk:latest
    pull_policy: never
    profiles: ["release"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 1g
    environment:
      HOME: /tmp
      EVENT_ROUTES: /workspace/outbox/routes.json
      AWS_SERVICES: /workspace/aws/services.json
      HTTP_RESOURCES: /workspace/http
      LOG_SCHEMA: /workspace/observability/log-schema.json
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ./infra/cdk:/workspace/cdk
      - ./backend/resources/outbox:/workspace/outbox:ro
      - ./backend/resources/aws:/workspace/aws:ro
      - ./backend/resources/http:/workspace/http:ro
      - ./backend/resources/observability:/workspace/observability:ro

  functions-release:
    image: dian-einvoice-functions:latest
    pull_policy: never
    profiles: ["release"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 1g
    environment:
      HOME: /tmp
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ./infra/functions:/workspace/functions
      - ./frontend:/workspace/web:ro
      - ./backend/resources/http:/workspace/http:ro
      - ./backend/resources/observability:/workspace/observability:ro
      - ./infra/cdk/edge:/workspace/edge:ro

  # actionlint over the workflows of GitHub Actions and their local action, with shellcheck over their scripts, without a
  # network (make cdk-check): the deployment workflow is validated here and never run. Read-only: the repository, whose
  # root it finds by its .git.
  actionlint:
    image: rhysd/actionlint:1.7.7
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 256m
    network_mode: none
    working_dir: /repo
    volumes:
      - .:/repo:ro
    command: ["-color"]

  # cfn-lint over the templates of the CDK app and of the serverless service, without a network (make cdk-check).
  cfn-lint:
    build:
      context: ./infra/cfn-lint
    image: dian-einvoice-cfn-lint:latest
    profiles: ["cloud"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: "no"
    mem_limit: 1g
    network_mode: none
    working_dir: /templates
    volumes:
      - ./infra/cdk/cdk.out:/templates/cdk:ro
      - ./infra/functions/.package:/templates/functions:ro
      - ./infra/cfn-lint/.cfnlintrc.yaml:/templates/.cfnlintrc.yaml:ro

  # The edge of the emulated cloud as a browser reaches it, in place of the development server of the web app and
  # of the API: 8601 serves the web app and the API on one origin, as in production, and 8600, the address of the
  # API, the same edge; the name api on the network too. A minimal reverse proxy in front of the CloudFront
  # distribution, which the emulator serves by host name (<id>.cloudfront.localhost.floci.io) and whose CloudFront
  # Function it does not run: the proxy gives the host name and rewrites the routes of the web app as the function
  # does (infra/functions/gateway.conf.template). make cloud-up writes the id of the distribution it deployed and
  # the paths of the API to infra/functions/.env.cloud. Every request goes through the distribution.
  cloud-gateway:
    image: nginx:1.30.6-alpine-slim
    profiles: ["cloud"]
    restart: "no"
    mem_limit: 32m
    env_file:
      - path: ./infra/functions/.env.cloud
        required: false
    environment:
      NGINX_ENVSUBST_FILTER: ^EDGE_
    volumes:
      - ./infra/functions/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8600:8000"
      - "127.0.0.1:8601:8000"
    networks:
      default:
        aliases:
          - api
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8000/_gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  db:
    image: mysql:8.4
    restart: "no"
    mem_limit: 1g
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: dian_einvoice
      MYSQL_USER: dian
      MYSQL_PASSWORD: dian
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Queue, cache and sessions. Append-only file, so queued jobs survive a restart. No published port, and
  # a password (REDIS_PASSWORD of backend/.env): it does not start without one.
  redis:
    image: redis:7-alpine
    restart: "no"
    mem_limit: 128m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        test -n "$$REDIS_PASSWORD" || { echo 'REDIS_PASSWORD is empty: run make up, which writes one to backend/.env.' >&2; exit 1; };
        exec redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  redis-data:
  simulator-data:
  mail-data:
  schematron-tools:
  # State of the local AWS emulator (profile cloud); make cloud-clean removes it.
  floci-data:
