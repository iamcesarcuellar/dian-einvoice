# Version and security updates, once a week (Monday morning, Colombian time), grouped per ecosystem: each
# ecosystem opens one pull request with its version updates and one with its security updates, and never
# more than two at a time, so they neither fill the repository nor spend the minutes of CI.
version: 2

updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    groups:
      composer:
        applies-to: version-updates
        patterns: ["*"]
      composer-security:
        applies-to: security-updates
        patterns: ["*"]

  # The web app (pnpm), the simulator, the CDK app, the serverless service of the functions and the
  # end-to-end test: one pull request for the five.
  - package-ecosystem: npm
    directories: [/frontend, /simulator, /infra/cdk, /infra/functions, /e2e]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    ignore:
      # TypeScript stays on 6.x on purpose (docs/limitations.md), so no pull request for its next major version.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @playwright/test must move together with the Playwright image of compose.yaml, which Dependabot proposes
      # apart (docker-compose below). Both are raised by hand, in one change (CONTRIBUTING.md).
      - dependency-name: "@playwright/test"
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /simulator, /infra/cdk, /infra/functions, /infra/cfn-lint]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    groups:
      docker:
        applies-to: version-updates
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  # cfn-lint, the linter of the templates (make cdk-check).
  - package-ecosystem: pip
    directory: /infra/cfn-lint
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    groups:
      pip:
        applies-to: version-updates
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    ignore:
      # The local database stays on MySQL 8.4, the version Aurora MySQL runs in the prod stage: nothing from 8.5 on.
      - dependency-name: "mysql"
        versions: [">= 8.5"]
      # The Playwright image of the e2e service moves with @playwright/test (the npm entry above), by hand.
      - dependency-name: "playwright"
    groups:
      docker-compose:
        applies-to: version-updates
        patterns: ["*"]
      docker-compose-security:
        applies-to: security-updates
        patterns: ["*"]

  # The workflows (CI and the deployment) and the composite action they use.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/prepare]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
