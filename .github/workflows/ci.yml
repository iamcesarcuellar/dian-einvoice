# Continuous integration: every job runs the same make targets as the local stack, in the containers of
# compose.yaml. No secrets and no paid services: the DIAN is the local simulator, email goes to the local mailbox,
# the AWS services of the emulated cloud are a local emulator, and the secrets of the stack are random values make
# env writes to backend/.env on each runner. Artifacts are uploaded only when a job fails, and kept for 3 days.
name: CI

# On every push to main, on every pull request, and by hand. A newer run of the same branch or pull request cancels
# the one still running.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The images come from .github/actions/prepare, built with the layer cache: the make targets use them as they are.
  BUILD: ""

jobs:
  lint:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          images: api web simulator-dev cdk functions
          backend: "true"
          frontend: "true"
      - name: Formatters and linters (make lint)
        run: make lint
      - name: Static analysis (make analyse)
        run: make analyse

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          images: api simulator
          backend: "true"
      - name: Unit and integration tests (make test-backend)
        run: make test-backend

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          images: web
          frontend: "true"
      - name: Unit tests (make test-frontend)
        run: make test-frontend

  simulator:
    name: Simulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          images: simulator-dev
      - name: Rules, failure modes and webhook receiver (make test-simulator)
        run: make test-simulator

  infra:
    name: Infrastructure as code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          images: cdk functions cfn-lint
      - name: The functions packaged by osls for both stages, tests and cdk-nag of the CDK app and of the functions, synthesis, cfn-lint and actionlint over the workflows, all without a network or credentials (make cdk-check)
        run: make cdk-check
      - name: Report of cdk-nag
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cdk-nag-report
          path: infra/cdk/cdk.out/validation-report.json
          if-no-files-found: ignore
          retention-days: 3

  security:
    name: Dependencies, licenses and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The whole history, for the secret scan.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
        with:
          images: api web simulator-dev cdk functions
          backend: "true"
          frontend: "true"
      - name: Vulnerabilities, licenses and secrets (make security)
        run: make security

  stack:
    name: End-to-end test and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # worker and relay are built from the image of api, so its cache serves them too.
      - uses: ./.github/actions/prepare
        with:
          images: api web simulator
          backend: "true"
          frontend: "true"
      - name: The stack with the synthetic demo data (make demo)
        run: make demo
      - name: End-to-end test in the browser, and nothing out of its box at three window sizes (make e2e)
        run: make e2e
      - name: The image encoder of the screenshots, in the image of the browser tooling (make test-tools)
        run: make test-tools
      - name: CUFE, CUDE, XSD and signatures, the AttachedDocument's included (make dian-check)
        run: make dian-check
      - name: Simultaneous payments (make payments-check)
        run: make payments-check
      - name: Public API over HTTP (make api-check)
        run: make api-check
      - name: The examples of the README and the API guide, webhook signatures included (make docs-examples)
        run: make docs-examples
      - name: Logs of the stack
        if: failure()
        run: docker compose --env-file backend/.env logs --no-color --tail=300
      - name: Traces of the end-to-end test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 3

  # On main and by hand, never on a pull request: the emulated cloud end to end, where the application runs as Lambda
  # functions behind the edge. The local AWS emulator with the Docker socket of the runner, the CDK app's local stage,
  # the functions and the edge deployed to it, the web app built and uploaded to its bucket, the edge checked and the
  # invoices through it, CloudFront, API Gateway, Lambda, SNS, SQS, S3, SES, DynamoDB, KMS and Secrets Manager (make
  # cloud-check), and the end-to-end test in a browser under the Content-Security-Policy of the web app (make cloud-e2e).
  cloud:
    name: Emulated cloud
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # With an empty layer cache this job took almost 26 of its first 30 minutes, 17 of them building the images, and the
    # layout check of make cloud-e2e adds a few more. 40 leaves room for a cold cache; a warm one takes about 10.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          images: web simulator cdk functions lambda
          frontend: "true"
      - name: The emulated cloud with the synthetic demo data, its functions deployed with osls behind the edge (make cloud-demo)
        run: make cloud-demo
      - name: No permanent process, the functions and their triggers, the edge, the fast path, a partial batch, the functions killed mid-process, the relay function and the scheduler (make cloud-check)
        run: make cloud-check
      - name: End-to-end test, the layout check and a tour of every route in the browser against the edge, under its Content-Security-Policy (make cloud-e2e)
        run: make cloud-e2e
      - name: Traces of the end-to-end test against the edge
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 3
      - name: Logs of the emulated cloud and of its functions
        if: failure()
        run: |
          docker compose --env-file backend/.env --profile cloud logs --no-color --tail=300
          for container in $(sh scripts/cloud/containers.sh list | cut -d' ' -f2); do
            echo "== $container"
            docker logs --tail 100 "$container" 2>&1
          done
