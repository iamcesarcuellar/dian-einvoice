# Continuous integration: every job runs the same make targets as the local stack, in the containers of
# compose.yaml. No secrets and no paid services: the DIAN is the local simulator, email goes to the local mailbox,
# the AWS services of the emulated cloud are a local emulator, and the secrets of the stack are random values make
# env writes to backend/.env on each runner. Artifacts are uploaded only when a job fails, and kept for 3 days.
name: CI

# While the repository is private, CI runs only when dispatched by hand: its automatic triggers (push and
# pull_request) are restored when the repository is public.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The images come from .github/actions/prepare, built with the layer cache: the make targets use them as they are.
  BUILD: ""

jobs:
  lint:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: api web simulator-dev cdk functions
          backend: "true"
          frontend: "true"
      - name: Formatters and linters (make lint)
        run: make lint
      - name: Static analysis (make analyse)
        run: make analyse

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: api simulator
          backend: "true"
      - name: Unit and integration tests (make test-backend)
        run: make test-backend

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: web
          frontend: "true"
      - name: Unit tests (make test-frontend)
        run: make test-frontend

  simulator:
    name: Simulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: simulator-dev
      - name: Rules, failure modes and webhook receiver (make test-simulator)
        run: make test-simulator

  infra:
    name: Infrastructure as code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: cdk functions cfn-lint
      - name: The functions packaged by osls for both stages, tests and cdk-nag of the CDK app and of the functions, synthesis and cfn-lint, all without a network or credentials (make cdk-check)
        run: make cdk-check
      - name: Report of cdk-nag
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cdk-nag-report
          path: infra/cdk/cdk.out/validation-report.json
          if-no-files-found: ignore
          retention-days: 3

  security:
    name: Dependencies, licenses and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The whole history, for the secret scan.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
        with:
          images: api web simulator-dev cdk functions
          backend: "true"
          frontend: "true"
      - name: Vulnerabilities, licenses and secrets (make security)
        run: make security

  stack:
    name: End-to-end test and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      # worker and relay are built from the image of api, so its cache serves them too.
      - uses: ./.github/actions/prepare
        with:
          images: api web simulator
          backend: "true"
          frontend: "true"
      - name: The stack with the synthetic demo data (make demo)
        run: make demo
      - name: End-to-end test in the browser (make e2e)
        run: make e2e
      - name: CUFE, CUDE, XSD and signatures (make dian-check)
        run: make dian-check
      - name: Simultaneous payments (make payments-check)
        run: make payments-check
      - name: Public API over HTTP (make api-check)
        run: make api-check
      - name: Logs of the stack
        if: failure()
        run: docker compose --env-file backend/.env logs --no-color --tail=300
      - name: Traces of the end-to-end test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 3

  # On main only: the emulated cloud end to end, where the application runs as Lambda functions. The local AWS
  # emulator with the Docker socket of the runner, the CDK stage local and the functions deployed to it, and the
  # invoices through API Gateway, Lambda, SNS, SQS, S3, SES, DynamoDB, KMS and Secrets Manager (make cloud-check).
  cloud:
    name: Emulated cloud
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: web simulator cdk functions lambda
          frontend: "true"
      - name: The emulated cloud, its functions deployed with osls (make cloud-up)
        run: make cloud-up
      - name: No permanent process, the functions and their triggers, the fast path, a partial batch, the functions killed mid-process, the relay function and the scheduler (make cloud-check)
        run: make cloud-check
      - name: Logs of the emulated cloud and of its functions
        if: failure()
        run: |
          docker compose --env-file backend/.env --profile cloud logs --no-color --tail=300
          for container in $(sh scripts/cloud/containers.sh list | cut -d' ' -f2); do
            echo "== $container"
            docker logs --tail 100 "$container" 2>&1
          done
