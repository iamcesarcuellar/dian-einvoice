# Continuous integration: every job runs the same make targets as the local stack, in the containers of
# compose.yaml. No secrets and no paid services: the DIAN is the local simulator, email goes to the local mailbox,
# the AWS services of the emulated cloud are a local emulator, and the secrets of the stack are random values make
# env writes to backend/.env on each runner.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The images come from .github/actions/prepare, built with the layer cache: the make targets use them as they are.
  BUILD: ""

jobs:
  lint:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: api web simulator-dev cdk
          backend: "true"
          frontend: "true"
      - name: Formatters and linters (make lint)
        run: make lint
      - name: Static analysis (make analyse)
        run: make analyse

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: api simulator
          backend: "true"
      - name: Unit and integration tests (make test-backend)
        run: make test-backend

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: web
          frontend: "true"
      - name: Unit tests (make test-frontend)
        run: make test-frontend

  simulator:
    name: Simulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: simulator-dev
      - name: Rules, failure modes and webhook receiver (make test-simulator)
        run: make test-simulator

  infra:
    name: Infrastructure as code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: cdk
      - name: Tests, cdk-nag and synthesis of both stages without a network (make cdk-check)
        run: make cdk-check
      - name: Report of cdk-nag
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdk-nag-report
          path: infra/cdk/cdk.out/validation-report.json
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependencies, licenses and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The whole history, for the secret scan.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
        with:
          images: api web simulator-dev cdk
          backend: "true"
          frontend: "true"
      - name: Vulnerabilities, licenses and secrets (make security)
        run: make security

  stack:
    name: End-to-end test and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      # worker and relay are built from the image of api, so its cache serves them too.
      - uses: ./.github/actions/prepare
        with:
          images: api web simulator
          backend: "true"
          frontend: "true"
      - name: The stack with the synthetic demo data (make demo)
        run: make demo
      - name: End-to-end test in the browser (make e2e)
        run: make e2e
      - name: CUFE, CUDE, XSD and signatures (make dian-check)
        run: make dian-check
      - name: Simultaneous payments (make payments-check)
        run: make payments-check
      - name: Public API over HTTP (make api-check)
        run: make api-check
      - name: Logs of the stack
        if: failure()
        run: docker compose --env-file backend/.env logs --no-color --tail=300
      - name: Traces of the end-to-end test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  # On main only: the emulated cloud end to end. The local AWS emulator, the CDK stage local deployed to it, and
  # 30 invoices through SNS, SQS, S3, SES, DynamoDB, KMS and Secrets Manager (make cloud-check).
  cloud:
    name: Emulated cloud
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          images: api web simulator cdk
          backend: "true"
          frontend: "true"
      - name: The emulated cloud (make cloud-up)
        run: make cloud-up
      - name: Invoices through the AWS services, consumers killed mid-process, a dead letter (make cloud-check)
        run: make cloud-check
      - name: Logs of the emulated cloud
        if: failure()
        run: docker compose --env-file backend/.env --profile cloud logs --no-color --tail=300
