# The deployment of the stage prod to a real AWS account, by hand only, one at a time, from the environment production,
# whose required reviewers approve each run and whose variables hold the parameters of the account (docs/deployment.md).
# It has never run: this repository deploys nothing to AWS, and actionlint validates this file (make cdk-check). Each step
# runs a step of scripts/deploy.sh, the script make cloud-up runs against the emulator. The job assumes the deploy role
# of the stack delivery with the OpenID Connect token of GitHub Actions: no long-lived key exists.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      reserved-concurrency:
        description: reserved, or unreserved while the quota of concurrent executions of the account is below the sum the functions reserve plus 100
        type: choice
        options:
          - reserved
          - unreserved
        default: reserved

permissions:
  contents: read
  id-token: write

# Never two deployments at once: a second one waits for the first to end.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy prod
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 90
    env:
      # The images come from .github/actions/prepare, built with the layer cache: scripts/deploy.sh uses them as they are.
      BUILD: ""
      AWS_REGION: us-east-1
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EDGE_DOMAIN_NAME: ${{ vars.EDGE_DOMAIN_NAME }}
      EDGE_CERTIFICATE_ARN: ${{ vars.EDGE_CERTIFICATE_ARN }}
      ALERTS_EMAIL: ${{ vars.ALERTS_EMAIL }}
      RESERVED_CONCURRENCY: ${{ inputs.reserved-concurrency }}
      # The tag of the image in ECR, which never moves: the commit deployed.
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: The role of the deployment, the account and the domain are set
        run: |
          missing=""
          [ -n "$DEPLOY_ROLE_ARN" ] || missing="$missing DEPLOY_ROLE_ARN (the ARN of the role the stack delivery creates, /dian-einvoice/prod/delivery/deploy-role-arn)"
          [ -n "$AWS_ACCOUNT_ID" ] || missing="$missing AWS_ACCOUNT_ID (the 12 digits of the account)"
          [ -n "$EDGE_DOMAIN_NAME" ] || missing="$missing EDGE_DOMAIN_NAME (the domain of the platform)"
          [ -n "$EDGE_CERTIFICATE_ARN" ] || missing="$missing EDGE_CERTIFICATE_ARN (its certificate of ACM in us-east-1)"
          if [ -n "$missing" ]; then
            echo "::error title=The environment production is not set up::Set the variables of the environment production:$missing. docs/deployment.md, first deployment."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          images: api cdk functions cfn-lint lambda web
          backend: "true"
          frontend: "true"

      - name: Checks without a network, before anything changes (make cdk-check, make migrations-check)
        run: make cdk-check migrations-check

      - name: Assume the deploy role (OpenID Connect, an hour at most)
        id: credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dian-einvoice-deploy-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: The differences with what is deployed (cdk diff)
        run: sh scripts/deploy.sh prod diff

      - name: The stacks before the functions
        run: sh scripts/deploy.sh prod stacks

      - name: The image of the functions, pushed to ECR by its digest
        id: image
        run: echo "image=$(sh scripts/deploy.sh prod image)" >> "$GITHUB_OUTPUT"

      - name: The migrations, with the console function on the new image first
        run: sh scripts/deploy.sh prod migrate "$IMAGE"
        env:
          IMAGE: ${{ steps.image.outputs.image }}

      - name: The functions on the new image
        run: sh scripts/deploy.sh prod functions "$IMAGE"
        env:
          IMAGE: ${{ steps.image.outputs.image }}

      - name: The edge
        run: sh scripts/deploy.sh prod edge

      - name: The observability
        run: sh scripts/deploy.sh prod observability

      - name: The web app, uploaded to the edge and invalidated
        run: sh scripts/deploy.sh prod panel

      - name: Smoke test, the health through the edge and a direct call to API Gateway refused
        run: sh scripts/deploy.sh prod smoke

      - name: Summary of the versions
        if: always() && steps.credentials.outcome == 'success'
        run: |
          {
            echo "## Deployment of $GITHUB_SHA"
            echo
            echo "Image: \`${IMAGE:-not pushed}\`. Rollback: \`sh scripts/deploy.sh prod rollback-image <image>\`, \`sh scripts/deploy.sh prod rollback-panel\` (docs/deployment.md)."
            echo
            echo '```text'
            sh scripts/deploy.sh prod versions
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ steps.image.outputs.image }}
